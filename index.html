<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Administrator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        ::selection {
            background: #ea580c;
            color: white;
        }

        nav {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 3rem;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #ea580c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-style: italic;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
            cursor: pointer;
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .nav-buttons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #9ca3af;
        }

        .nav-btn:hover {
            color: white;
            background: #1f2937;
        }

        .nav-btn.active {
            color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }

        .hamburger-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid #374151;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .hamburger-btn:hover {
            border-color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }

        .hamburger-btn span {
            width: 20px;
            height: 2px;
            background: #9ca3af;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger-btn:hover span {
            background: #ea580c;
        }

        .hamburger-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .menu-dropdown {
            position: absolute;
            top: 90px;
            right: 1.5rem;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 0.5rem;
            min-width: 220px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            display: none;
            animation: slideDown 0.3s ease;
        }

        .menu-dropdown.active {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .menu-item:hover {
            background: #1f2937;
            color: white;
        }

        .menu-item.active {
            background: rgba(234, 88, 12, 0.1);
            color: #ea580c;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .form-container {
            max-width: 28rem;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            border: 1px solid rgba(234, 88, 12, 0.2);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ea580c;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .image-upload {
            position: relative;
            width: 100%;
            height: 14rem;
            border-radius: 12px;
            border: 2px dashed #374151;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #222;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .image-upload:hover {
            border-color: #ea580c;
        }

        .image-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6b7280;
        }

        .image-placeholder svg {
            width: 40px;
            height: 40px;
            margin-bottom: 0.5rem;
        }

        .remove-image-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .remove-image-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .remove-image-btn svg {
            width: 20px;
            height: 20px;
            stroke: white;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fb923c;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #222;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus {
            border-color: #ea580c;
        }

        .form-select {
            cursor: pointer;
        }

        .form-select option {
            background: #222;
            color: white;
        }

        .form-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #ea580c;
            color: white;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.2);
        }

        .btn-primary:hover {
            background: #f97316;
        }

        .btn-secondary {
            background: #1f2937;
            color: #d1d5db;
        }

        .btn-secondary:hover {
            background: #374151;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 0 1rem;
        }

        .catalog-title {
            font-size: 1.875rem;
            font-weight: 900;
        }

        .catalog-title span {
            color: #ea580c;
        }

        .btn-add {
            background: #ea580c;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
        }

        .btn-add:hover {
            background: #f97316;
        }

        .loading {
            text-align: center;
            padding: 5rem 0;
            color: rgba(234, 88, 12, 0.5);
            font-weight: 700;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .empty-state {
            text-align: center;
            padding: 5rem 1rem;
            background: #111;
            border-radius: 1.5rem;
            border: 1px solid #1f2937;
            margin: 0 1rem;
        }

        .empty-state p {
            color: #6b7280;
            font-size: 1.125rem;
            font-style: italic;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 0 1rem;
        }

        .link-card {
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #1f2937;
            transition: all 0.3s;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .link-card:hover {
            border-color: rgba(234, 88, 12, 0.5);
        }

        .link-image {
            position: relative;
            height: 12rem;
            overflow: hidden;
            background: black;
        }

        .link-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
            transition: all 0.7s;
        }

        .link-card:hover img {
            opacity: 1;
            transform: scale(1.05);
        }

        .link-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .link-title {
            font-weight: 700;
            color: #f3f4f6;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-style: italic;
        }

        .link-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
            padding-top: 1.25rem;
            border-top: 1px solid #1f2937;
        }

        .link-actions.no-title {
            border-top: none;
            padding-top: 0;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.625rem;
            border-radius: 12px;
            border: 1px solid;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.625rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.025em;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .action-link {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.2);
            text-decoration: none;
        }

        .action-link:hover {
            background: #22c55e;
            color: white;
            border-color: #4ade80;
        }

        .action-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.2);
        }

        .action-edit:hover {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .action-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .action-delete:hover {
            background: #ef4444;
            color: white;
            border-color: #f87171;
        }

        .footer {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            font-size: 0.625rem;
            color: #4b5563;
            background: rgba(0, 0, 0, 0.9);
            padding: 0.625rem;
            border-radius: 8px;
            border: 1px solid #1f2937;
            font-family: monospace;
            letter-spacing: 0.1em;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 640px) {
            .nav-title {
                display: none;
            }

            .nav-btn span {
                display: none;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }

            .menu-dropdown {
                right: 1rem;
                left: 1rem;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- NAVEGACIÓN PRINCIPAL -->
    <!-- ============================================ -->
    <nav>
        <div class="nav-container">
            <div class="nav-logo">
                <div id="logoIcon" class="logo-icon" role="button" tabindex="0" aria-label="Volver">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"></polyline>
                  </svg>
                </div>
                <h1 class="nav-title">Links Administrator</h1>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" id="navHome">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Inicio</span>
                </button>
                
                <button class="hamburger-btn" id="hamburgerBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>

        <div class="menu-dropdown" id="menuDropdown">
            <div class="menu-item" data-view="axl">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Catálogo Axl
            </div>
            <div class="menu-item" data-view="frecuentes">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                Links Frecuentes
            </div>
            <div class="menu-item" data-view="varios">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                Varios Links
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- ============================================ -->
        <!-- VISTA: FORMULARIO (CREAR/EDITAR) -->
        <!-- ============================================ -->
        <div id="homeView" class="view">
            <div class="form-container">
                <h2 class="form-title" id="formTitle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nuevo Link
                </h2>
                
                <form id="linkForm">
                    <div class="image-upload" id="imageUpload">
                        <div class="image-placeholder" id="imagePlaceholder">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <p style="font-weight: 700; font-size: 0.875rem;">Seleccionar de Galería</p>
                        </div>
                        <img id="imagePreview" style="display: none;" alt="Preview">
                        <button type="button" class="remove-image-btn" id="removeImageBtn" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">

                    <div class="form-group">
                        <label class="form-label">
                            <span>Categoría</span>
                        </label>
                        <select class="form-select" id="categorySelect" required>
                            <option value="axl">Catálogo Axl</option>
                            <option value="frecuentes">Links Frecuentes</option>
                            <option value="varios">Varios Links</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span>Nombre</span>
                            <span>(Opcional)</span>
                        </label>
                        <input type="text" class="form-input" id="titleInput" placeholder="Ej: Mi Portafolio">
                    </div>

                    <div class="form-group">
                        <label class="form-label">URL de Destino</label>
                        <input type="text" class="form-input" id="urlInput" placeholder="google.com" required>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            <span id="btnSubmitText">Guardar</span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="btnCancel">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- VISTA: CATÁLOGO AXL -->
        <!-- ============================================ -->
        <div id="axlView" class="view active">
            <div class="catalog-header">
                <h2 class="catalog-title">Catálogo <span>Axl</span></h2>
                <button class="btn-add" data-category="axl">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Agregar Link
                </button>
            </div>
            <div id="axlContainer">
                <div class="loading">CARGANDO...</div>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- VISTA: LINKS FRECUENTES -->
        <!-- ============================================ -->
        <div id="frecuentesView" class="view">
            <div class="catalog-header">
                <h2 class="catalog-title">Links <span>Frecuentes</span></h2>
                <button class="btn-add" data-category="frecuentes">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Agregar Link
                </button>
            </div>
            <div id="frecuentesContainer">
                <div class="loading">CARGANDO...</div>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- VISTA: VARIOS LINKS -->
        <!-- ============================================ -->
        <div id="variosView" class="view">
            <div class="catalog-header">
                <h2 class="catalog-title">Varios <span>Links</span></h2>
                <button class="btn-add" data-category="varios">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Agregar Link
                </button>
            </div>
            <div id="variosContainer">
                <div class="loading">CARGANDO...</div>
            </div>
        </div>
    </div>

    <div class="footer">DARK ENGINE V3 | PERSONAL</div>

    <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let supabaseClient;
        const linksData = {
            axl: [],
            frecuentes: [],
            varios: []
        };
        let isEditing = false;
        let editingId = null;
        let editingCategory = null;
        let currentImageFile = null;
        let currentImageUrl = null; // Para mantener la URL al editar
        let currentView = 'axl';

        // ============================================
        // ELEMENTOS DEL DOM
        // ============================================
        const elements = {
            views: {
                home: document.getElementById('homeView'),
                axl: document.getElementById('axlView'),
                frecuentes: document.getElementById('frecuentesView'),
                varios: document.getElementById('variosView')
            },
            containers: {
                axl: document.getElementById('axlContainer'),
                frecuentes: document.getElementById('frecuentesContainer'),
                varios: document.getElementById('variosContainer')
            },
            nav: {
                home: document.getElementById('navHome'),
                hamburger: document.getElementById('hamburgerBtn'),
                menu: document.getElementById('menuDropdown'),
                logo: document.getElementById('logoIcon')
            },
            form: {
                element: document.getElementById('linkForm'),
                title: document.getElementById('formTitle'),
                submitText: document.getElementById('btnSubmitText'),
                category: document.getElementById('categorySelect'),
                titleInput: document.getElementById('titleInput'),
                url: document.getElementById('urlInput'),
                cancel: document.getElementById('btnCancel')
            },
            image: {
                upload: document.getElementById('imageUpload'),
                input: document.getElementById('fileInput'),
                preview: document.getElementById('imagePreview'),
                placeholder: document.getElementById('imagePlaceholder'),
                removeBtn: document.getElementById('removeImageBtn')
            }
        };

        // ============================================
        // CONFIGURACIÓN DE CATEGORÍAS
        // ============================================
        const categories = {
            axl: { title: 'Catálogo Axl' },
            frecuentes: { title: 'Links Frecuentes' },
            varios: { title: 'Varios Links' }
        };

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        async function init() {
            const SUPABASE_URL = 'https://nhqwwqfhazpzlksiftmd.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ocXd3cWZoYXpwemxrc2lmdG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1ODExMDYsImV4cCI6MjA4MzE1NzEwNn0.5GbOjyTy9Xa9_oB71pdNfiEdRtjxbixQ6khFzl4jn8o';

            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                alert('ERROR: No se encontró la configuración de Supabase');
                return;
            }

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            await loadAllLinks();
            setupEventListeners();
            switchView('axl');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Navegación principal
            elements.nav.home.addEventListener('click', () => {
                resetForm();
                switchView('home');
            });

            // Logo - volver atrás
            elements.nav.logo.addEventListener('click', () => window.history.back());
            elements.nav.logo.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { 
                    e.preventDefault(); 
                    window.history.back(); 
                }
            });

            // Menú hamburguesa
            elements.nav.hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                elements.nav.hamburger.classList.toggle('active');
                elements.nav.menu.classList.toggle('active');
            });

            // Cerrar menú al hacer clic fuera
            document.addEventListener('click', (e) => {
                if (!elements.nav.hamburger.contains(e.target) && !elements.nav.menu.contains(e.target)) {
                    elements.nav.hamburger.classList.remove('active');
                    elements.nav.menu.classList.remove('active');
                }
            });

            // Items del menú (delegación de eventos)
            elements.nav.menu.addEventListener('click', (e) => {
                const menuItem = e.target.closest('.menu-item');
                if (menuItem) {
                    const view = menuItem.getAttribute('data-view');
                    switchView(view);
                    elements.nav.hamburger.classList.remove('active');
                    elements.nav.menu.classList.remove('active');
                }
            });

            // Botones "Agregar Link" (delegación de eventos)
            document.addEventListener('click', (e) => {
                const addBtn = e.target.closest('.btn-add');
                if (addBtn) {
                    const category = addBtn.getAttribute('data-category');
                    openFormForCategory(category);
                }
            });

            // Formulario
            elements.form.cancel.addEventListener('click', () => {
                resetForm();
                switchView(currentView);
            });

            // Imagen
            elements.image.upload.addEventListener('click', (e) => {
                if (e.target !== elements.image.removeBtn && !elements.image.removeBtn.contains(e.target)) {
                    elements.image.input.click();
                }
            });
            elements.image.input.addEventListener('change', handleImageChange);
            elements.image.removeBtn.addEventListener('click', removeImage);

            // Submit del formulario
            elements.form.element.addEventListener('submit', handleSubmit);
        }

        // ============================================
        // FUNCIONES DE NAVEGACIÓN
        // ============================================
        function switchView(view) {
            currentView = view;
            
            // Ocultar todas las vistas
            Object.values(elements.views).forEach(v => v.classList.remove('active'));
            
            // Desactivar navegación
            elements.nav.home.classList.remove('active');
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

            // Activar vista correspondiente
            if (view === 'home') {
                elements.views.home.classList.add('active');
                elements.nav.home.classList.add('active');
            } else {
                elements.views[view].classList.add('active');
                document.querySelector(`[data-view="${view}"]`).classList.add('active');
            }
        }

        function openFormForCategory(category) {
            resetForm();
            elements.form.category.value = category;
            switchView('home');
        }

        // ============================================
        // MANEJO DE IMÁGENES
        // ============================================
        function handleImageChange(e) {
            const file = e.target.files[0];
            if (!file) return;

            currentImageFile = file;
            const reader = new FileReader();
            reader.onloadend = () => {
                elements.image.preview.src = reader.result;
                elements.image.preview.style.display = 'block';
                elements.image.placeholder.style.display = 'none';
                elements.image.removeBtn.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removeImage(e) {
            e.stopPropagation();
            currentImageFile = null;
            currentImageUrl = null;
            elements.image.preview.style.display = 'none';
            elements.image.placeholder.style.display = 'flex';
            elements.image.removeBtn.style.display = 'none';
            elements.image.input.value = '';
        }

        // ============================================
        // CARGA DE DATOS
        // ============================================
        async function loadAllLinks() {
            await Promise.all([
                loadLinks('axl'),
                loadLinks('frecuentes'),
                loadLinks('varios')
            ]);
        }

        async function loadLinks(category) {
            try {
                const tableName = `links_${category}`;
                const { data, error } = await supabaseClient
                    .from(tableName)
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                linksData[category] = data || [];
                renderLinks(category);
            } catch (error) {
                console.error(`Error cargando links de ${category}:`, error);
                elements.containers[category].innerHTML = '<div class="empty-state"><p>Error al cargar los links</p></div>';
            }
        }

        // ============================================
        // RENDERIZADO DE LINKS
        // ============================================
        function renderLinks(category) {
            const container = elements.containers[category];
            const links = linksData[category];

            if (links.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Tu galería está vacía.</p></div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'links-grid';

            links.forEach(link => {
                grid.appendChild(createLinkCard(link, category));
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function createLinkCard(link, category) {
            const card = document.createElement('div');
            card.className = 'link-card';
            
            card.innerHTML = `
                <div class="link-image">
                    <img src="${link.image_url}" alt="${link.title || 'Link'}">
                </div>
                <div class="link-content">
                    ${link.title ? `<h3 class="link-title">${link.title}</h3>` : ''}
                    <div class="link-actions ${!link.title ? 'no-title' : ''}">
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="action-btn action-link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                <polyline points="15 3 21 3 21 9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                            Link
                        </a>
                        <button class="action-btn action-edit" data-action="edit" data-id="${link.id}" data-category="${category}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            Editar
                        </button>
                        <button class="action-btn action-delete" data-action="delete" data-id="${link.id}" data-category="${category}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Borrar
                        </button>
                    </div>
                </div>
            `;

            // Delegación de eventos para las acciones
            card.addEventListener('click', (e) => {
                const actionBtn = e.target.closest('[data-action]');
                if (actionBtn) {
                    const action = actionBtn.getAttribute('data-action');
                    const id = actionBtn.getAttribute('data-id');
                    const category = actionBtn.getAttribute('data-category');
                    
                    if (action === 'edit') editLink(id, category);
                    if (action === 'delete') deleteLink(id, category);
                }
            });
            
            return card;
        }

        // ============================================
        // SUBIR IMAGEN A SUPABASE
        // ============================================
        async function uploadImage(file) {
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage
                .from('link-images')
                .upload(fileName, file);

            if (error) throw error;

            const { data: { publicUrl } } = supabaseClient.storage
                .from('link-images')
                .getPublicUrl(fileName);

            return publicUrl;
        }

        // ============================================
        // CRUD: CREAR/ACTUALIZAR
        // ============================================
        async function handleSubmit(e) {
            e.preventDefault();
            
            // Validar imagen (solo si es nuevo link)
            if (!currentImageFile && !isEditing) {
                alert('Por favor selecciona una imagen');
                return;
            }

            // Validar que haya imagen (nueva o existente) al editar
            if (isEditing && !currentImageFile && !currentImageUrl) {
                alert('Por favor selecciona una imagen');
                return;
            }

            if (!elements.form.url.value) {
                alert('Por favor ingresa una URL');
                return;
            }

            const category = elements.form.category.value;

            try {
                let imageUrl = currentImageUrl; // Mantener URL existente
                
                // Solo subir nueva imagen si hay archivo nuevo
                if (currentImageFile) {
                    imageUrl = await uploadImage(currentImageFile);
                }

                let finalUrl = elements.form.url.value.trim();
                if (!/^https?:\/\//i.test(finalUrl)) {
                    finalUrl = 'https://' + finalUrl;
                }

                const linkData = {
                    title: elements.form.titleInput.value.trim() || null,
                    url: finalUrl,
                    image_url: imageUrl
                };

                const tableName = `links_${category}`;

                if (isEditing && editingId) {
                    const { error } = await supabaseClient
                        .from(tableName)
                        .update(linkData)
                        .eq('id', editingId);

                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from(tableName)
                        .insert([linkData]);

                    if (error) throw error;
                }

                resetForm();
                await loadLinks(category);
                switchView(category);
            } catch (error) {
                console.error('Error guardando link:', error);
                alert('Error al guardar el link: ' + error.message);
            }
        }

        // ============================================
        // CRUD: EDITAR
        // ============================================
        async function editLink(id, category) {
            const link = linksData[category].find(l => l.id === id);
            if (!link) return;

            isEditing = true;
            editingId = id;
            editingCategory = category;
            currentImageUrl = link.image_url; // Guardar URL existente
            
            elements.form.category.value = category;
            elements.form.titleInput.value = link.title || '';
            elements.form.url.value = link.url;
            elements.image.preview.src = link.image_url;
            elements.image.preview.style.display = 'block';
            elements.image.placeholder.style.display = 'none';
            elements.image.removeBtn.style.display = 'flex';

            elements.form.title.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Modificar Link
            `;
            elements.form.submitText.textContent = 'Actualizar';

            switchView('home');
        }

        // ============================================
        // CRUD: ELIMINAR
        // ============================================
        async function deleteLink(id, category) {
            if (!confirm('¿Estás seguro de eliminar este link?')) return;

            try {
                const tableName = `links_${category}`;
                const { error } = await supabaseClient
                    .from(tableName)
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                await loadLinks(category);
            } catch (error) {
                console.error('Error eliminando link:', error);
                alert('Error al eliminar el link: ' + error.message);
            }
        }

        // ============================================
        // RESETEAR FORMULARIO
        // ============================================
        function resetForm() {
            isEditing = false;
            editingId = null;
            editingCategory = null;
            currentImageFile = null;
            currentImageUrl = null;
            
            elements.form.titleInput.value = '';
            elements.form.url.value = '';
            elements.image.preview.style.display = 'none';
            elements.image.placeholder.style.display = 'flex';
            elements.image.removeBtn.style.display = 'none';
            elements.image.input.value = '';
            elements.form.category.value = 'axl';

            elements.form.title.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Nuevo Link
            `;
            elements.form.submitText.textContent = 'Guardar';
        }

        // ============================================
        // INICIAR APLICACIÓN
        // ============================================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
