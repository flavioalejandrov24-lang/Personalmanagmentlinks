<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Administrator</title>
    <link rel="icon" type="image/png" href="linkicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="https://progressier.app/naMhh0eBROHiI9F341OS/progressier.json"/>
    <script defer src="https://progressier.app/naMhh0eBROHiI9F341OS/script.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        ::selection {
            background: #ea580c;
            color: white;
        }

        nav {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 1.25rem;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        /* Grupo izquierdo: flecha retroceso + título segmento */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .nav-segment-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: #fb923c99;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        /* Grupo derecho: reorder + add + hamburger */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #ea580c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.35);
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            flex-shrink: 0;
        }

        .logo-icon:hover { background: #f97316; }

        /* Botón reordenar en nav — morado */
        .nav-reorder-btn {
            width: 40px;
            height: 40px;
            background: rgba(139, 92, 246, 0.15);
            color: rgba(167, 139, 250, 0.9);
            border-radius: 10px;
            border: 1px solid rgba(139, 92, 246, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .nav-reorder-btn:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: rgba(139, 92, 246, 0.6);
            color: #c4b5fd;
        }

        .nav-reorder-btn.active {
            background: rgba(109, 40, 217, 0.4);
            border-color: rgba(139, 92, 246, 0.7);
            color: #ddd6fe;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .nav-reorder-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-reorder-btn.active svg { transform: rotate(180deg); }

        /* Botón añadir — verde traslúcido */
        .nav-add-btn {
            width: 40px;
            height: 40px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border-radius: 10px;
            border: 1px solid rgba(34, 197, 94, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .nav-add-btn:hover {
            background: rgba(34, 197, 94, 0.28);
            border-color: rgba(34, 197, 94, 0.6);
            color: #4ade80;
        }

        .nav-add-btn svg { width: 20px; height: 20px; }

        /* ============================================ */
        /* HAMBURGER — 3 líneas (menú de navegación)   */
        /* ============================================ */
        .hamburger-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid #374151;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .hamburger-btn:hover {
            border-color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }

        .hamburger-btn span {
            width: 20px;
            height: 2px;
            background: #9ca3af;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger-btn:hover span {
            background: #ea580c;
        }

        .hamburger-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .menu-dropdown {
            position: absolute;
            top: 90px;
            right: 1.5rem;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 0.5rem;
            min-width: 220px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            display: none;
            animation: slideDown 0.3s ease;
        }

        .menu-dropdown.active {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .menu-item:hover {
            background: #1f2937;
            color: white;
        }

        .menu-item.active {
            background: rgba(234, 88, 12, 0.1);
            color: #ea580c;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ============================================ */
        /* FORM */
        /* ============================================ */
        .form-container {
            max-width: 28rem;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            border: 1px solid rgba(234, 88, 12, 0.2);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ea580c;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .image-upload {
            position: relative;
            width: 100%;
            height: 14rem;
            border-radius: 12px;
            border: 2px dashed #374151;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #222;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .image-upload:hover { border-color: #ea580c; }

        .image-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6b7280;
        }

        .image-placeholder svg {
            width: 40px;
            height: 40px;
            margin-bottom: 0.5rem;
        }

        .remove-image-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .remove-image-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .remove-image-btn svg { width: 20px; height: 20px; stroke: white; }

        .form-group { margin-bottom: 1rem; }

        .form-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fb923c;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #222;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus { border-color: #ea580c; }
        .form-select { cursor: pointer; }
        .form-select option { background: #222; color: white; }

        .form-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #ea580c;
            color: white;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.2);
        }

        .btn-primary:hover { background: #f97316; }

        .btn-secondary {
            background: #1f2937;
            color: #d1d5db;
        }

        .btn-secondary:hover { background: #374151; }

        .btn-cancel {
            background: rgba(239, 68, 68, 0.85);
            color: white;
        }

        .btn-cancel:hover { background: #ef4444; }

        /* ============================================ */
        /* BANNER REORDER — morado traslúcido           */
        /* ============================================ */
        .reorder-banner {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: rgba(109, 40, 217, 0.18);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 12px;
            margin: 0 1rem 1.5rem;
        }

        .reorder-banner.active { display: flex; }

        /* Fila superior: icono + texto */
        .reorder-banner-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .reorder-banner-info svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: #c4b5fd;
        }

        /* Fila inferior: botones Cancelar + Guardar */
        .reorder-banner-actions {
            display: flex;
            gap: 0.625rem;
            justify-content: flex-end;
        }

        /* Botón Cancelar — rojo */
        .btn-cancel-order {
            background: rgba(239, 68, 68, 0.85);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-cancel-order:hover { background: #ef4444; }

        /* Botón Guardar orden — morado */
        .btn-save-order {
            background: rgba(109, 40, 217, 0.85);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.45rem 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-save-order:hover { background: #7c3aed; }
        .btn-save-order:disabled { opacity: 0.6; cursor: default; }

        /* ============================================ */
        /* SKELETON LOADING */
        /* ============================================ */
        .skeleton-grid {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0 1rem;
        }

        .skeleton-card {
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }

        .skeleton-card-body {
            display: flex;
            flex-direction: row;
            min-height: 88px;
        }

        .skeleton-img {
            width: 88px;
            min-width: 88px;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-content { padding: 0.875rem 1rem; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0.5rem; }

        .skeleton-line {
            height: 12px;
            border-radius: 4px;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line.short { width: 60%; }

        .skeleton-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid #1f2937;
        }

        .skeleton-btn {
            height: 36px;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================ */
        /* GRID DE LINKS */
        /* ============================================ */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 0 1rem;
        }

        /* ============================================ */
        /* CARDS — estilo rectangular horizontal        */
        /* ============================================ */
        .link-card {
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #1f2937;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* Zona superior: imagen izq + info der */
        .link-card-body {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            min-height: 88px;
        }

        .link-card:hover { border-color: rgba(234, 88, 12, 0.5); }

        /* Modo reorder */
        .links-grid.reorder-mode .link-card {
            cursor: grab;
            border-color: rgba(234, 88, 12, 0.3);
        }

        .links-grid.reorder-mode .link-card:hover {
            border-color: rgba(234, 88, 12, 0.7);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.2);
        }

        .links-grid.reorder-mode .link-card:active { cursor: grabbing; }

        .link-card.dragging {
            opacity: 0.4;
            border-color: #ea580c !important;
            transform: scale(0.98);
        }

        .link-card.drag-over {
            border-color: #ea580c !important;
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.4) !important;
            transform: scale(1.02);
        }

        .drag-handle {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            background: rgba(234, 88, 12, 0.85);
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
        }

        .drag-handle svg { width: 14px; height: 14px; }

        .links-grid.reorder-mode .drag-handle { display: flex; }

        /* Imagen — lado izquierdo, ancho fijo */
        .link-image {
            position: relative;
            width: 88px;
            min-width: 88px;
            overflow: hidden;
            background: #111;
            flex-shrink: 0;
        }

        .link-card img.card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.7s;
        }

        .link-card img.card-img.loaded { opacity: 0.9; }
        .link-card:hover img.card-img.loaded { opacity: 1; transform: scale(1.05); }

        .img-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            transition: opacity 0.4s;
        }

        .img-skeleton.hidden { opacity: 0; pointer-events: none; }

        /* Info — lado derecho */
        .link-content {
            padding: 0.55rem 0.875rem 0.55rem 0.875rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-width: 0;
            gap: 0.18rem;
        }

        .link-title {
            font-weight: 900;
            color: #f3f4f6;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .link-category-badge {
            font-size: 0.78rem;
            font-weight: 700;
            color: #ea580c;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            line-height: 1.2;
        }

        /* Fila URL + botón copiar */
        .link-url-row {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.08rem;
        }

        .link-url-display {
            font-size: 0.78rem;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .copy-url-btn {
            flex-shrink: 0;
            background: rgba(107, 114, 128, 0.15);
            border: 1px solid rgba(107, 114, 128, 0.25);
            border-radius: 5px;
            padding: 2px 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #6b7280;
        }

        .copy-url-btn:hover {
            background: rgba(234, 88, 12, 0.15);
            border-color: rgba(234, 88, 12, 0.4);
            color: #ea580c;
        }

        .copy-url-btn.copied {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #22c55e;
        }

        .copy-url-btn svg { width: 11px; height: 11px; }

        /* Botones — fila inferior de la card */
        .link-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
            border-top: 1px solid #1f2937;
            padding: 0.5rem;
            background: #111;
        }

        .link-actions.no-title { border-top: 1px solid #1f2937; }

        .links-grid.reorder-mode .link-actions { pointer-events: none; opacity: 0.4; }

        .action-btn {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            padding: 0.55rem 0.4rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.72rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .action-btn:last-child { border-right: none; }
        .action-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

        .action-link {
            background: rgba(34, 197, 94, 0.14);
            color: #22c55e;
            text-decoration: none;
            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .action-link:hover {
            background: #22c55e;
            color: white;
            border-color: #22c55e;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .action-edit {
            background: rgba(59, 130, 246, 0.14);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .action-edit:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .action-delete {
            background: rgba(239, 68, 68, 0.14);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .action-delete:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* ============================================ */
        /* EMPTY STATE */
        /* ============================================ */
        .empty-state {
            text-align: center;
            padding: 5rem 1rem;
            background: #111;
            border-radius: 1.5rem;
            border: 1px solid #1f2937;
            margin: 0 1rem;
        }

        .empty-state p {
            color: #6b7280;
            font-size: 1.125rem;
            font-style: italic;
        }

        /* ============================================ */
        /* TOAST NOTIFICATION */
        /* ============================================ */
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a1a1a;
            border: 1px solid #ea580c;
            color: #fb923c;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================ */
        /* FOOTER */
        /* ============================================ */
        .footer {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            font-size: 0.625rem;
            color: #4b5563;
            background: rgba(0, 0, 0, 0.9);
            padding: 0.625rem;
            border-radius: 8px;
            border: 1px solid #1f2937;
            font-family: monospace;
            letter-spacing: 0.1em;

    </style>
</head>
<body>

        <div class="menu-dropdown" id="menuDropdown">

    <div class="container">
        <!-- VISTA: FORMULARIO (CREAR/EDITAR) -->
        <div id="homeView" class="view">
            <div class="form-container">
                <h2 class="form-title" id="formTitle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>

                <form id="linkForm">

                        <div class="image-placeholder" id="imagePlaceholder">

                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    <input type="file" id="fileInput" accept="image/*" style="display: none;">

                    <div class="form-group">

                    <div class="form-group">

                        <input type="text" class="form-input" id="titleInput" placeholder="Ej: Mi Portafolio">

                    <div class="form-buttons">

        </div>

        <!-- VISTA: CATÁLOGO AXL -->
        <div id="axlView" class="view active">

        <!-- VISTA: LINKS FRECUENTES -->

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 9l4-4 4 4M9 5v14M19 15l-4 4-4-4M15 19V5"/>
                    </svg>
                    <span>Arrastra las cards para reordenarlas</span>
                </div>
                <div class="reorder-banner-actions">
                    <button class="btn-cancel-order" data-category="frecuentes" id="cancelOrderBtn-frecuentes">Cancelar</button>
                    <button class="btn-save-order" data-category="frecuentes" id="saveOrderBtn-frecuentes">Guardar orden</button>
                </div>

            <div id="frecuentesContainer">

        <!-- VISTA: VARIOS LINKS (renombrado a todos) -->
        <div id="variosView" class="view">
            <div class="reorder-banner" id="reorderBanner-varios">
                <div class="reorder-banner-info">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 9l4-4 4 4M9 5v14M19 15l-4 4-4-4M15 19V5"/>
                    </svg>
                    <span>Arrastra las cards para reordenarlas</span>
                </div>
                <div class="reorder-banner-actions">
                    <button class="btn-cancel-order" data-category="varios" id="cancelOrderBtn-varios">Cancelar</button>
                    <button class="btn-save-order" data-category="varios" id="saveOrderBtn-varios">Guardar orden</button>
                </div>

            <div id="variosContainer">
                <div class="skeleton-grid" id="skeletonVarios"></div>

        </div>

        <!-- VISTA: TODO LINKS (mezcla de axl + frecuentes) -->
        <div id="todosView" class="view">
            <div id="todosContainer">
                <div class="skeleton-grid" id="skeletonTodos"></div>
            </div>

    </div>

    <!-- Toast de notificación -->
    <div class="toast" id="toast"></div>

    <div class="footer">DARK ENGINE V3 | PERSONAL</div>

    <script>
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let supabaseClient;
        const linksData = { axl: [], frecuentes: [], varios: [] };
        // Snapshot del orden original para poder cancelar
        const originalOrder = { axl: [], frecuentes: [], varios: [] };
        let isEditing = false;
        let editingId = null;
        let editingCategory = null;
        let currentImageFile = null;
        let currentImageUrl = null;
        let currentView = 'axl';
        let lastCatalogView = 'axl'; // Último catálogo visitado (para retroceso y cancelar)

        const reorderState = { axl: false, frecuentes: false, varios: false };

        // Nombres de los segmentos para el título del nav
        const segmentTitles = {
            axl: 'Axel Links',
            frecuentes: 'Fav Links',
            todos: 'Todo Links',
            varios: 'Varios Links',
            home: ''
        };

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const elements = {
            views: {
                home: document.getElementById('homeView'),
                axl: document.getElementById('axlView'),
                frecuentes: document.getElementById('frecuentesView'),
                varios: document.getElementById('variosView'),
                todos: document.getElementById('todosView')
            },
            containers: {
                axl: document.getElementById('axlContainer'),
                frecuentes: document.getElementById('frecuentesContainer'),
                varios: document.getElementById('variosContainer'),
                todos: document.getElementById('todosContainer')
            },
            nav: {
                logo: document.getElementById('logoIcon'),
                reorderBtn: document.getElementById('navReorderBtn'),
                addBtn: document.getElementById('navAddBtn'),
                hamburger: document.getElementById('hamburgerBtn'),
                menu: document.getElementById('menuDropdown'),
                segmentTitle: document.getElementById('navSegmentTitle')
            },
            form: {
                element: document.getElementById('linkForm'),
                title: document.getElementById('formTitle'),
                submitText: document.getElementById('btnSubmitText'),
                category: document.getElementById('categorySelect'),
                titleInput: document.getElementById('titleInput'),
                url: document.getElementById('urlInput'),
                cancel: document.getElementById('btnCancel')
            },
            image: {
                upload: document.getElementById('imageUpload'),
                input: document.getElementById('fileInput'),
                preview: document.getElementById('imagePreview'),
                placeholder: document.getElementById('imagePlaceholder'),
                removeBtn: document.getElementById('removeImageBtn')
            }
        };

        // ============================================
        // TOAST
        // ============================================
        function showToast(msg, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ============================================
        // SKELETON LOADING
        // ============================================
        function showSkeletons(category, count = 6) {
            const skeletonMap = {
                axl: 'skeletonAxl',
                frecuentes: 'skeletonFrecuentes',
                varios: 'skeletonVarios',
                todos: 'skeletonTodos'
            };
            const skeletonEl = document.getElementById(skeletonMap[category]);
            if (!skeletonEl) return;
            skeletonEl.innerHTML = '';
            for (let i = 0; i < count; i++) {
                skeletonEl.innerHTML += `
                    <div class="skeleton-card">
                        <div class="skeleton-card-body">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-line" style="width:70%"></div>
                                <div class="skeleton-line short"></div>
                                <div class="skeleton-line" style="width:85%"></div>
                            </div>
                        </div>
                        <div class="skeleton-actions">
                            <div class="skeleton-btn"></div>
                            <div class="skeleton-btn"></div>
                            <div class="skeleton-btn"></div>
                        </div>
                    </div>`;
            }
            skeletonEl.style.display = 'grid';
        }

        function hideSkeletons(category) {
            const skeletonMap = {
                axl: 'skeletonAxl',
                frecuentes: 'skeletonFrecuentes',
                varios: 'skeletonVarios',
                todos: 'skeletonTodos'
            };
            const skeletonEl = document.getElementById(skeletonMap[category]);
            if (skeletonEl) skeletonEl.style.display = 'none';
        }

        // ============================================
        // LAZY IMAGE LOADING
        // ============================================
        function setupLazyImage(imgEl, skeletonEl, src) {
            const tempImg = new Image();
            tempImg.onload = () => {
                imgEl.src = src;
                imgEl.classList.add('loaded');
                skeletonEl.classList.add('hidden');
            };
            tempImg.onerror = () => {
                skeletonEl.classList.add('hidden');
                imgEl.classList.add('loaded');
            };
            tempImg.src = src;
        }

        // Intersection Observer — solo carga imágenes visibles
        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const src = img.getAttribute('data-src');
                    const skeleton = img.previousElementSibling;
                    if (src) {
                        setupLazyImage(img, skeleton, src);
                        imageObserver.unobserve(img);
                    }
                }
            });
        }, { rootMargin: '150px' });

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        async function init() {
            const SUPABASE_URL = 'https://nhqwwqfhazpzlksiftmd.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ocXd3cWZoYXpwemxrc2lmdG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1ODExMDYsImV4cCI6MjA4MzE1NzEwNn0.5GbOjyTy9Xa9_oB71pdNfiEdRtjxbixQ6khFzl4jn8o';

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Mostrar skeletons de inmediato
            ['axl', 'frecuentes', 'varios'].forEach(cat => showSkeletons(cat));

            // Cargar las 3 categorías en paralelo
            await loadAllLinks();
            setupEventListeners();
            switchView('axl');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Flecha retroceso
            elements.nav.logo.addEventListener('click', () => {
                if (currentView === 'home') switchView(lastCatalogView);
                else switchView('axl');
            });

            // Botón reordenar del nav — actúa sobre la vista actual
            elements.nav.reorderBtn.addEventListener('click', () => {
                if (currentView !== 'home') toggleReorderMode(currentView);
            });

            // Botón añadir del nav — abre formulario con la categoría activa
            elements.nav.addBtn.addEventListener('click', () => {
                openFormForCategory(currentView !== 'home' ? currentView : lastCatalogView);
            });

            // Menú hamburguesa
            elements.nav.hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                elements.nav.hamburger.classList.toggle('active');
                elements.nav.menu.classList.toggle('active');
            });

            document.addEventListener('click', (e) => {
                if (!elements.nav.hamburger.contains(e.target) && !elements.nav.menu.contains(e.target)) {
                    elements.nav.hamburger.classList.remove('active');
                    elements.nav.menu.classList.remove('active');
                }
            });

            elements.nav.menu.addEventListener('click', (e) => {
                const menuItem = e.target.closest('.menu-item');
                if (menuItem) {
                    const view = menuItem.getAttribute('data-view');
                    switchView(view);
                    elements.nav.hamburger.classList.remove('active');
                    elements.nav.menu.classList.remove('active');
                }
            });

            // Botones GUARDAR orden
            document.addEventListener('click', (e) => {
                const saveBtn = e.target.closest('.btn-save-order');
                if (saveBtn) {
                    const category = saveBtn.getAttribute('data-category');
                    saveOrder(category);
                }
            });

            // Botones CANCELAR orden
            document.addEventListener('click', (e) => {
                const cancelBtn = e.target.closest('.btn-cancel-order');
                if (cancelBtn) {
                    const category = cancelBtn.getAttribute('data-category');
                    cancelOrder(category);
                }
            });

            elements.form.cancel.addEventListener('click', () => { resetForm(); switchView(lastCatalogView); });

            elements.image.upload.addEventListener('click', (e) => {
                if (e.target !== elements.image.removeBtn && !elements.image.removeBtn.contains(e.target)) {
                    elements.image.input.click();
                }
            });

            elements.image.input.addEventListener('change', handleImageChange);
            elements.image.removeBtn.addEventListener('click', removeImage);
            elements.form.element.addEventListener('submit', handleSubmit);
        }

        // ============================================
        // NAVEGACIÓN
        // ============================================
        function switchView(view) {
            currentView = view;
            if (view !== 'home') lastCatalogView = view;
            Object.values(elements.views).forEach(v => v && v.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

            // Actualizar título del segmento en nav
            if (elements.nav.segmentTitle) {
                elements.nav.segmentTitle.textContent = segmentTitles[view] || '';
                elements.nav.segmentTitle.style.display = view === 'home' ? 'none' : 'block';
            }

            if (view === 'home') {
                elements.views.home.classList.add('active');
                elements.nav.reorderBtn.style.display = 'none';
            } else if (view === 'todos') {
                elements.views.todos.classList.add('active');
                const menuItem = document.querySelector(`[data-view="todos"]`);
                if (menuItem) menuItem.classList.add('active');
                elements.nav.reorderBtn.style.display = 'none'; // Todo Links no tiene reorder propio
                renderTodosView();
            } else {
                elements.views[view].classList.add('active');
                const menuItem = document.querySelector(`[data-view="${view}"]`);
                if (menuItem) menuItem.classList.add('active');
                elements.nav.reorderBtn.style.display = 'flex';
                elements.nav.reorderBtn.classList.toggle('active', !!reorderState[view]);
            }
        }

        // ============================================
        // RENDERIZAR VISTA TODO LINKS (mezcla axl + frecuentes)
        // ============================================
        function renderTodosView() {
            const container = elements.containers.todos;
            // Mezcla: axl primero, luego frecuentes; cada card lleva su categoría original
            const allLinks = [
                ...linksData.axl.map(l => ({ ...l, _cat: 'axl' })),
                ...linksData.frecuentes.map(l => ({ ...l, _cat: 'frecuentes' }))
            ];

            if (allLinks.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No hay links aún.</p></div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'links-grid';
            grid.id = 'grid-todos';

            const fragment = document.createDocumentFragment();
            allLinks.forEach(link => {
                const card = createLinkCard(link, link._cat);
                fragment.appendChild(card);
                const img = card.querySelector('.card-img');
                if (img) imageObserver.observe(img);
            });
            grid.appendChild(fragment);

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function openFormForCategory(category) {
            resetForm();
            // Si estamos en "todos", abrir formulario para axl por defecto
            const formCategory = (category === 'todos') ? 'axl' : category;
            elements.form.category.value = formCategory;
            switchView('home');
        }

        // ============================================
        // IMAGEN
        // ============================================
        function handleImageChange(e) {
            const file = e.target.files[0];
            if (!file) return;
            currentImageFile = file;
            const reader = new FileReader();
            reader.onloadend = () => {
                elements.image.preview.src = reader.result;
                elements.image.preview.style.display = 'block';
                elements.image.placeholder.style.display = 'none';
                elements.image.removeBtn.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removeImage(e) {
            e.stopPropagation();
            currentImageFile = null;
            currentImageUrl = null;
            elements.image.preview.style.display = 'none';
            elements.image.placeholder.style.display = 'flex';
            elements.image.removeBtn.style.display = 'none';
            elements.image.input.value = '';
        }

        // ============================================
        // CARGA DE DATOS — paralela para mayor velocidad
        // ============================================
        async function loadAllLinks() {
            await Promise.all([
                loadLinks('axl'),
                loadLinks('frecuentes'),
                loadLinks('varios')
            ]);
        }

        async function loadLinks(category) {
            try {
                const tableName = `links_${category}`;
                const { data, error } = await supabaseClient
                    .from(tableName)
                    .select('id, title, url, image_url, sort_order, created_at')
                    .order('sort_order', { ascending: true })
                    .order('created_at', { ascending: false });

                if (error) throw error;

                linksData[category] = data || [];
                hideSkeletons(category);
                renderLinks(category);
            } catch (error) {
                console.error(`Error cargando links de ${category}:`, error);
                hideSkeletons(category);
                elements.containers[category].innerHTML = '<div class="empty-state"><p>Error al cargar los links</p></div>';
            }
        }

        // ============================================
        // RENDERIZADO
        // ============================================
        function renderLinks(category) {
            const container = elements.containers[category];
            const links = linksData[category];

            if (links.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Tu galería está vacía.</p></div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'links-grid';
            grid.id = `grid-${category}`;

            if (reorderState[category]) grid.classList.add('reorder-mode');

            // Usar DocumentFragment para mejor rendimiento
            const fragment = document.createDocumentFragment();
            links.forEach(link => {
                const card = createLinkCard(link, category);
                fragment.appendChild(card);
                const img = card.querySelector('.card-img');
                if (img) imageObserver.observe(img);
            });
            grid.appendChild(fragment);

            container.innerHTML = '';
            container.appendChild(grid);

            setupDragAndDrop(grid, category);
        }

        function createLinkCard(link, category) {
            const card = document.createElement('div');
            card.className = 'link-card';
            card.setAttribute('data-id', link.id);
            card.setAttribute('draggable', 'true');

            const categoryLabels = { axl: 'Axel Links', frecuentes: 'Fav Links', varios: 'Varios Links' };
            const categoryLabel = categoryLabels[category] || category;

            // Truncar URL para mostrar
            let displayUrl = link.url || '';
            try { displayUrl = new URL(link.url).hostname; } catch(e) {}

            card.innerHTML = `
                <div class="drag-handle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="9" cy="5" r="1" fill="currentColor"/>
                        <circle cx="15" cy="5" r="1" fill="currentColor"/>
                        <circle cx="9" cy="12" r="1" fill="currentColor"/>
                        <circle cx="15" cy="12" r="1" fill="currentColor"/>
                        <circle cx="9" cy="19" r="1" fill="currentColor"/>
                        <circle cx="15" cy="19" r="1" fill="currentColor"/>
                    </svg>
                </div>
                <div class="link-card-body">
                    <div class="link-image">
                        <div class="img-skeleton"></div>
                        <img
                            class="card-img"
                            data-src="${link.image_url}"
                            src=""
                            alt="${link.title || 'Link'}"
                            loading="lazy"
                        >
                    </div>
                    <div class="link-content">
                        ${link.title ? `<h3 class="link-title">${link.title}</h3>` : ''}
                        <span class="link-category-badge">${categoryLabel}</span>
                        <div class="link-url-row">
                            <span class="link-url-display">${displayUrl}</span>
                            <button class="copy-url-btn" data-url="${link.url}" title="Copiar URL">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="link-actions">
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="action-btn action-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        Link
                    </a>
                    <button class="action-btn action-edit" data-action="edit" data-id="${link.id}" data-category="${category}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        Editar
                    </button>
                    <button class="action-btn action-delete" data-action="delete" data-id="${link.id}" data-category="${category}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Borrar
                    </button>
                </div>
            `;

            card.addEventListener('click', (e) => {
                // Botón copiar URL
                const copyBtn = e.target.closest('.copy-url-btn');
                if (copyBtn) {
                    e.stopPropagation();
                    const url = copyBtn.getAttribute('data-url');
                    navigator.clipboard.writeText(url).then(() => {
                        copyBtn.classList.add('copied');
                        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
                        setTimeout(() => {
                            copyBtn.classList.remove('copied');
                            copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                        }, 1800);
                    }).catch(() => showToast('✗ No se pudo copiar'));
                    return;
                }

                if (reorderState[category]) return;
                const actionBtn = e.target.closest('[data-action]');
                if (actionBtn) {
                    const action = actionBtn.getAttribute('data-action');
                    const id = actionBtn.getAttribute('data-id');
                    const cat = actionBtn.getAttribute('data-category');
                    if (action === 'edit') editLink(id, cat);
                    if (action === 'delete') deleteLink(id, cat);
                }
            });

            return card;
        }

        // ============================================
        // DRAG & DROP — Desktop + Touch
        // ============================================
        function setupDragAndDrop(grid, category) {
            let dragSrcCard = null;

            // ---- DESKTOP ----
            grid.addEventListener('dragstart', (e) => {
                if (!reorderState[category]) return;
                dragSrcCard = e.target.closest('.link-card');
                if (!dragSrcCard) return;
                setTimeout(() => dragSrcCard.classList.add('dragging'), 0);
                e.dataTransfer.effectAllowed = 'move';
            });

            grid.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!reorderState[category]) return;
                const target = e.target.closest('.link-card');
                if (!target || target === dragSrcCard) return;
                grid.querySelectorAll('.link-card').forEach(c => c.classList.remove('drag-over'));
                target.classList.add('drag-over');
                const cards = [...grid.querySelectorAll('.link-card')];
                const srcIdx = cards.indexOf(dragSrcCard);
                const tgtIdx = cards.indexOf(target);
                if (srcIdx < tgtIdx) {
                    grid.insertBefore(dragSrcCard, target.nextSibling);
                } else {
                    grid.insertBefore(dragSrcCard, target);
                }
            });

            grid.addEventListener('dragleave', (e) => {
                const target = e.target.closest('.link-card');
                if (target) target.classList.remove('drag-over');
            });

            grid.addEventListener('dragend', () => {
                if (!reorderState[category]) return;
                grid.querySelectorAll('.link-card').forEach(c => {
                    c.classList.remove('dragging');
                    c.classList.remove('drag-over');
                });
                dragSrcCard = null;
            });

            // ---- MOBILE (Touch) ----
            let touchCard = null;
            let touchClone = null;
            let touchOffsetX = 0;
            let touchOffsetY = 0;
            let lastTouchTarget = null;

            grid.addEventListener('touchstart', (e) => {
                if (!reorderState[category]) return;
                touchCard = e.target.closest('.link-card');
                if (!touchCard) return;
                const touch = e.touches[0];
                const rect = touchCard.getBoundingClientRect();
                touchOffsetX = touch.clientX - rect.left;
                touchOffsetY = touch.clientY - rect.top;
                touchClone = touchCard.cloneNode(true);
                touchClone.style.cssText = `
                    position: fixed;
                    width: ${rect.width}px;
                    height: ${rect.height}px;
                    top: ${rect.top}px;
                    left: ${rect.left}px;
                    opacity: 0.85;
                    pointer-events: none;
                    z-index: 9999;
                    border-radius: 1rem;
                    border: 2px solid #ea580c;
                    box-shadow: 0 25px 50px rgba(234,88,12,0.3);
                    transition: none;
                    transform: scale(1.02);
                `;
                document.body.appendChild(touchClone);
                touchCard.classList.add('dragging');
                e.preventDefault();
            }, { passive: false });

            grid.addEventListener('touchmove', (e) => {
                if (!reorderState[category] || !touchCard || !touchClone) return;
                e.preventDefault();
                const touch = e.touches[0];
                touchClone.style.left = `${touch.clientX - touchOffsetX}px`;
                touchClone.style.top = `${touch.clientY - touchOffsetY}px`;
                touchClone.style.display = 'none';
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                touchClone.style.display = '';
                const targetCard = el ? el.closest('.link-card') : null;
                if (lastTouchTarget && lastTouchTarget !== touchCard) {
                    lastTouchTarget.classList.remove('drag-over');
                }
                if (targetCard && targetCard !== touchCard) {
                    targetCard.classList.add('drag-over');
                    lastTouchTarget = targetCard;
                    const cards = [...grid.querySelectorAll('.link-card')];
                    const srcIdx = cards.indexOf(touchCard);
                    const tgtIdx = cards.indexOf(targetCard);
                    if (srcIdx < tgtIdx) {
                        grid.insertBefore(touchCard, targetCard.nextSibling);
                    } else {
                        grid.insertBefore(touchCard, targetCard);
                    }
                }
            }, { passive: false });

            grid.addEventListener('touchend', () => {
                if (!reorderState[category]) return;
                if (touchClone) { touchClone.remove(); touchClone = null; }
                if (touchCard) { touchCard.classList.remove('dragging'); touchCard = null; }
                if (lastTouchTarget) { lastTouchTarget.classList.remove('drag-over'); lastTouchTarget = null; }
            });
        }

        // ============================================
        // MODO REORDEN — activar/desactivar
        // ============================================
        function toggleReorderMode(category) {
            reorderState[category] = !reorderState[category];

            const banner = document.getElementById(`reorderBanner-${category}`);
            const grid = document.getElementById(`grid-${category}`);

            // Sincronizar botón del nav
            elements.nav.reorderBtn.classList.toggle('active', reorderState[category]);
            banner.classList.toggle('active', reorderState[category]);

            if (grid) {
                grid.classList.toggle('reorder-mode', reorderState[category]);
            }

            // Guardar snapshot del orden actual para poder cancelar
            if (reorderState[category]) {
                originalOrder[category] = linksData[category].map(l => l.id);
            }
        }

        // ============================================
        // CANCELAR ORDEN — restaura el orden original
        // ============================================
        function cancelOrder(category) {
            const grid = document.getElementById(`grid-${category}`);
            if (!grid) {
                toggleReorderMode(category);
                return;
            }

            // Reordenar el DOM al orden original guardado
            const savedIds = originalOrder[category];
            savedIds.forEach(id => {
                const card = grid.querySelector(`[data-id="${id}"]`);
                if (card) grid.appendChild(card);
            });

            // Desactivar modo reorder sin guardar
            reorderState[category] = false;
            elements.nav.reorderBtn.classList.remove('active');
            const banner = document.getElementById(`reorderBanner-${category}`);
            banner.classList.remove('active');
            grid.classList.remove('reorder-mode');

            showToast('✗ Cambios de orden cancelados');
        }

        // ============================================
        // GUARDAR ORDEN EN SUPABASE
        // ============================================
        async function saveOrder(category) {
            const grid = document.getElementById(`grid-${category}`);
            if (!grid) return;

            const saveBtn = document.getElementById(`saveOrderBtn-${category}`);
            const cancelBtn = document.getElementById(`cancelOrderBtn-${category}`);
            saveBtn.disabled = true;
            cancelBtn.disabled = true;
            saveBtn.textContent = 'Guardando...';

            const cards = [...grid.querySelectorAll('.link-card')];
            const tableName = `links_${category}`;

            try {
                const updates = cards.map((card, index) => ({
                    id: card.getAttribute('data-id'),
                    sort_order: index
                }));

                // Usar upsert en batch para mayor velocidad
                const { error } = await supabaseClient
                    .from(tableName)
                    .upsert(updates, { onConflict: 'id' });

                if (error) {
                    // Fallback: actualizar uno a uno si upsert falla
                    await Promise.all(updates.map(({ id, sort_order }) =>
                        supabaseClient.from(tableName).update({ sort_order }).eq('id', id)
                    ));
                }

                // Actualizar array local
                const newOrder = cards.map(card =>
                    linksData[category].find(l => l.id === card.getAttribute('data-id'))
                ).filter(Boolean);
                linksData[category] = newOrder;

                showToast('✓ Orden guardado');
                toggleReorderMode(category);
            } catch (error) {
                console.error('Error guardando orden:', error);
                showToast('✗ Error al guardar el orden');
            } finally {
                saveBtn.disabled = false;
                cancelBtn.disabled = false;
                saveBtn.textContent = 'Guardar orden';
            }
        }

        // ============================================
        // SUBIR IMAGEN
        // ============================================
        async function uploadImage(file) {
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage
                .from('link-images')
                .upload(fileName, file);
            if (error) throw error;
            const { data: { publicUrl } } = supabaseClient.storage
                .from('link-images')
                .getPublicUrl(fileName);
            return publicUrl;
        }

        // ============================================
        // CRUD: CREAR / ACTUALIZAR
        // ============================================
        async function handleSubmit(e) {
            e.preventDefault();

            if (!currentImageFile && !isEditing) {
                alert('Por favor selecciona una imagen');
                return;
            }

            if (isEditing && !currentImageFile && !currentImageUrl) {
                alert('Por favor selecciona una imagen');
                return;
            }

            if (!elements.form.url.value) {
                alert('Por favor ingresa una URL');
                return;
            }

            const category = elements.form.category.value;

            try {
                let imageUrl = currentImageUrl;
                if (currentImageFile) imageUrl = await uploadImage(currentImageFile);

                let finalUrl = elements.form.url.value.trim();
                if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;

                const linkData = {
                    title: elements.form.titleInput.value.trim() || null,
                    url: finalUrl,
                    image_url: imageUrl
                };

                const tableName = `links_${category}`;

                if (isEditing && editingId) {
                    const { error } = await supabaseClient.from(tableName).update(linkData).eq('id', editingId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from(tableName).insert([linkData]);
                    if (error) throw error;
                }

                resetForm();
                await loadLinks(category);
                // Si estamos en todos, refrescar esa vista también
                if (currentView === 'todos') renderTodosView();
                switchView(category);
            } catch (error) {
                console.error('Error guardando link:', error);
                alert('Error al guardar el link: ' + error.message);
            }
        }

        // ============================================
        // CRUD: EDITAR
        // ============================================
        async function editLink(id, category) {
            const link = linksData[category].find(l => l.id === id);
            if (!link) return;

            isEditing = true;
            editingId = id;
            editingCategory = category;
            currentImageUrl = link.image_url;

            elements.form.category.value = category;
            elements.form.titleInput.value = link.title || '';
            elements.form.url.value = link.url;
            elements.image.preview.src = link.image_url;
            elements.image.preview.style.display = 'block';
            elements.image.placeholder.style.display = 'none';
            elements.image.removeBtn.style.display = 'flex';

            elements.form.title.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Modificar Link
            `;
            elements.form.submitText.textContent = 'Actualizar';
            switchView('home');
        }

        // ============================================
        // CRUD: ELIMINAR
        // ============================================
        async function deleteLink(id, category) {
            if (!confirm('¿Estás seguro de eliminar este link?')) return;
            try {
                const tableName = `links_${category}`;
                const { error } = await supabaseClient.from(tableName).delete().eq('id', id);
                if (error) throw error;
                await loadLinks(category);
                if (currentView === 'todos') renderTodosView();
            } catch (error) {
                console.error('Error eliminando link:', error);
                alert('Error al eliminar el link: ' + error.message);
            }
        }

        // ============================================
        // RESET FORMULARIO
        // ============================================
        function resetForm() {
            isEditing = false;
            editingId = null;
            editingCategory = null;
            currentImageFile = null;
            currentImageUrl = null;

            elements.form.titleInput.value = '';
            elements.form.url.value = '';
            elements.image.preview.style.display = 'none';
            elements.image.placeholder.style.display = 'flex';
            elements.image.removeBtn.style.display = 'none';
            elements.image.input.value = '';
            elements.form.category.value = 'axl';

            elements.form.title.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Nuevo Link
            `;
            elements.form.submitText.textContent = 'Guardar';
        }

        // ============================================
        // ARRANCAR
        // ============================================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
