<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Administrator</title>
    <link rel="icon" type="image/png" href="linkicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        ::selection {
            background: #ea580c;
            color: white;
        }

        nav {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 3rem;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #ea580c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-style: italic;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
            cursor: pointer;
        }

        .nav-title {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .nav-buttons {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
            background: transparent;
            color: #9ca3af;
        }

        .nav-btn:hover {
            color: white;
            background: #1f2937;
        }

        .nav-btn.active {
            color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }

        .hamburger-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: 1px solid #374151;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .hamburger-btn:hover {
            border-color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }

        .hamburger-btn span {
            width: 20px;
            height: 2px;
            background: #9ca3af;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .hamburger-btn:hover span {
            background: #ea580c;
        }

        .hamburger-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        .menu-dropdown {
            position: absolute;
            top: 90px;
            right: 1.5rem;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 0.5rem;
            min-width: 220px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            display: none;
            animation: slideDown 0.3s ease;
        }

        .menu-dropdown.active {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .menu-item:hover {
            background: #1f2937;
            color: white;
        }

        .menu-item.active {
            background: rgba(234, 88, 12, 0.1);
            color: #ea580c;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ============================================ */
        /* FORM */
        /* ============================================ */
        .form-container {
            max-width: 28rem;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            border: 1px solid rgba(234, 88, 12, 0.2);
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ea580c;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .image-upload {
            position: relative;
            width: 100%;
            height: 14rem;
            border-radius: 12px;
            border: 2px dashed #374151;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #222;
            transition: all 0.3s;
            margin-bottom: 1.5rem;
        }

        .image-upload:hover { border-color: #ea580c; }

        .image-upload img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6b7280;
        }

        .image-placeholder svg {
            width: 40px;
            height: 40px;
            margin-bottom: 0.5rem;
        }

        .remove-image-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .remove-image-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .remove-image-btn svg { width: 20px; height: 20px; stroke: white; }

        .form-group { margin-bottom: 1rem; }

        .form-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fb923c;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #222;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus { border-color: #ea580c; }
        .form-select { cursor: pointer; }
        .form-select option { background: #222; color: white; }

        .form-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #ea580c;
            color: white;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.2);
        }

        .btn-primary:hover { background: #f97316; }

        .btn-secondary {
            background: #1f2937;
            color: #d1d5db;
        }

        .btn-secondary:hover { background: #374151; }

        /* ============================================ */
        /* CATALOG HEADER */
        /* ============================================ */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 0 1rem;
        }

        .catalog-title {
            font-size: 1.875rem;
            font-weight: 900;
        }

        .catalog-title span { color: #ea580c; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Botón modo reorder */
        .btn-reorder {
            background: transparent;
            color: #9ca3af;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid #374151;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reorder:hover {
            color: #ea580c;
            border-color: #ea580c;
            background: rgba(234, 88, 12, 0.1);
        }

        .btn-reorder.active {
            color: #ea580c;
            border-color: #ea580c;
            background: rgba(234, 88, 12, 0.15);
            box-shadow: 0 0 15px rgba(234, 88, 12, 0.2);
        }

        .btn-reorder svg { width: 16px; height: 16px; }

        .btn-add {
            background: #ea580c;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
        }

        .btn-add:hover { background: #f97316; }

        /* Banner modo ordenamiento */
        .reorder-banner {
            display: none;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.25rem;
            background: rgba(234, 88, 12, 0.1);
            border: 1px solid rgba(234, 88, 12, 0.3);
            border-radius: 12px;
            margin: 0 1rem 1.5rem;
            color: #fb923c;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .reorder-banner.active { display: flex; }

        .reorder-banner svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .reorder-banner span { flex: 1; }

        .btn-save-order {
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-save-order:hover { background: #f97316; }
        .btn-save-order:disabled { opacity: 0.6; cursor: default; }

        /* ============================================ */
        /* SKELETON LOADING */
        /* ============================================ */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 0 1rem;
        }

        .skeleton-card {
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #1f2937;
        }

        .skeleton-img {
            height: 12rem;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-content { padding: 1.25rem; }

        .skeleton-line {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 1rem;
        }

        .skeleton-line.short { width: 60%; }

        .skeleton-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #1f2937;
        }

        .skeleton-btn {
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================ */
        /* GRID DE LINKS */
        /* ============================================ */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 0 1rem;
        }

        /* ============================================ */
        /* CARDS */
        /* ============================================ */
        .link-card {
            background: #1a1a1a;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #1f2937;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            user-select: none;
        }

        .link-card:hover { border-color: rgba(234, 88, 12, 0.5); }

        /* Modo reorder - cursor y estilos */
        .links-grid.reorder-mode .link-card {
            cursor: grab;
            border-color: rgba(234, 88, 12, 0.3);
        }

        .links-grid.reorder-mode .link-card:hover {
            border-color: rgba(234, 88, 12, 0.7);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.2);
        }

        .links-grid.reorder-mode .link-card:active { cursor: grabbing; }

        /* Card siendo arrastrada */
        .link-card.dragging {
            opacity: 0.4;
            border-color: #ea580c !important;
            transform: scale(0.98);
        }

        /* Card donde se va a soltar */
        .link-card.drag-over {
            border-color: #ea580c !important;
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.4) !important;
            transform: scale(1.02);
        }

        /* Handle de arrastre (icono visible en modo reorder) */
        .drag-handle {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            background: rgba(234, 88, 12, 0.85);
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: white;
        }

        .drag-handle svg { width: 14px; height: 14px; }

        .links-grid.reorder-mode .drag-handle { display: flex; }

        .link-image {
            position: relative;
            height: 12rem;
            overflow: hidden;
            background: black;
        }

        /* Imagen con lazy loading */
        .link-card img.card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.7s;
        }

        .link-card img.card-img.loaded { opacity: 0.9; }
        .link-card:hover img.card-img.loaded { opacity: 1; transform: scale(1.05); }

        /* Placeholder mientras carga la imagen */
        .img-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            transition: opacity 0.4s;
        }

        .img-skeleton.hidden { opacity: 0; pointer-events: none; }

        .link-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .link-title {
            font-weight: 700;
            color: #f3f4f6;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-style: italic;
        }

        .link-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
            padding-top: 1.25rem;
            border-top: 1px solid #1f2937;
        }

        .link-actions.no-title {
            border-top: none;
            padding-top: 0;
        }

        /* En modo reorder, ocultar los botones de acción */
        .links-grid.reorder-mode .link-actions { pointer-events: none; opacity: 0.4; }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.625rem;
            border-radius: 12px;
            border: 1px solid;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.625rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.025em;
        }

        .action-btn svg { width: 16px; height: 16px; }

        .action-link {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.2);
            text-decoration: none;
        }

        .action-link:hover {
            background: #22c55e;
            color: white;
            border-color: #4ade80;
        }

        .action-edit {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.2);
        }

        .action-edit:hover {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .action-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .action-delete:hover {
            background: #ef4444;
            color: white;
            border-color: #f87171;
        }

        /* ============================================ */
        /* EMPTY STATE */
        /* ============================================ */
        .empty-state {
            text-align: center;
            padding: 5rem 1rem;
            background: #111;
            border-radius: 1.5rem;
            border: 1px solid #1f2937;
            margin: 0 1rem;
        }

        .empty-state p {
            color: #6b7280;
            font-size: 1.125rem;
            font-style: italic;
        }

        /* ============================================ */
        /* TOAST NOTIFICATION */
        /* ============================================ */
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a1a1a;
            border: 1px solid #ea580c;
            color: #fb923c;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================ */
        /* FOOTER */
        /* ============================================ */
        .footer {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            font-size: 0.625rem;
            color: #4b5563;
            background: rgba(0, 0, 0, 0.9);
            padding: 0.625rem;
            border-radius: 8px;
            border: 1px solid #1f2937;
            font-family: monospace;
            letter-spacing: 0.1em;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 640px) {
            .nav-title { display: none; }
            .nav-btn span { display: none; }
            .links-grid { grid-template-columns: 1fr; }
            .skeleton-grid { grid-template-columns: 1fr; }

            .menu-dropdown {
                right: 1rem;
                left: 1rem;
                min-width: auto;
            }

            .btn-reorder span { display: none; }
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- NAVEGACIÓN PRINCIPAL -->
    <!-- ============================================ -->
    <nav>
        <div class="nav-container">
            <div class="nav-logo">
                <div id="logoIcon" class="logo-icon" role="button" tabindex="0" aria-label="Volver">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </div>
                <h1 class="nav-title">Links Administrator</h1>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" id="navHome">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Inicio</span>
                </button>
                <button class="hamburger-btn" id="hamburgerBtn">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>

        <div class="menu-dropdown" id="menuDropdown">
            <div class="menu-item" data-view="axl">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                </svg>
                Catálogo Axl
            </div>
            <div class="menu-item" data-view="frecuentes">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                Links Frecuentes
            </div>
            <div class="menu-item" data-view="varios">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                Varios Links
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- ============================================ -->
        <!-- VISTA: FORMULARIO (CREAR/EDITAR) -->
        <!-- ============================================ -->
        <div id="homeView" class="view">
            <div class="form-container">
                <h2 class="form-title" id="formTitle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        // ============================================

        // Estado del drag & drop por categoría
        const reorderState = { axl: false, frecuentes: false, varios: false };

        // ============================================

        // ============================================
        // TOAST HELPER
        // ============================================
        function showToast(msg, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ============================================
        // SKELETON LOADING - Genera skeletons mientras carga
        // ============================================
        function showSkeletons(category, count = 6) {
            const skeletonMap = {
                axl: 'skeletonAxl',
                frecuentes: 'skeletonFrecuentes',
                varios: 'skeletonVarios'
            };
            const skeletonEl = document.getElementById(skeletonMap[category]);
            if (!skeletonEl) return;

            skeletonEl.innerHTML = '';
            for (let i = 0; i < count; i++) {
                skeletonEl.innerHTML += `
                    <div class="skeleton-card">
                        <div class="skeleton-img"></div>
                        <div class="skeleton-content">
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-actions">
                                <div class="skeleton-btn"></div>
                                <div class="skeleton-btn"></div>
                                <div class="skeleton-btn"></div>
                            </div>
                        </div>
                    </div>`;
            }
            skeletonEl.style.display = 'grid';
        }

        function hideSkeletons(category) {
            const skeletonMap = {
                axl: 'skeletonAxl',
                frecuentes: 'skeletonFrecuentes',
                varios: 'skeletonVarios'
            };
            const skeletonEl = document.getElementById(skeletonMap[category]);
            if (skeletonEl) skeletonEl.style.display = 'none';
        }

        // ============================================
        // LAZY IMAGE LOADING
        // ============================================
        function setupLazyImage(imgEl, skeletonEl, src) {
            const tempImg = new Image();
            tempImg.onload = () => {
                imgEl.src = src;
                imgEl.classList.add('loaded');
                skeletonEl.classList.add('hidden');
            };
            tempImg.onerror = () => {
                skeletonEl.classList.add('hidden');
                imgEl.classList.add('loaded');
            };
            tempImg.src = src;
        }

        // Intersection Observer para lazy load (solo carga imágenes visibles)
        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const src = img.getAttribute('data-src');
                    const skeleton = img.previousElementSibling;
                    if (src) {
                        setupLazyImage(img, skeleton, src);
                        imageObserver.unobserve(img);
                    }
                }
            });
        }, { rootMargin: '100px' });

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        async function init() {
            const SUPABASE_URL = 'https://nhqwwqfhazpzlksiftmd.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ocXd3cWZoYXpwemxrc2lmdG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1ODExMDYsImV4cCI6MjA4MzE1NzEwNn0.5GbOjyTy9Xa9_oB71pdNfiEdRtjxbixQ6khFzl4jn8o';

            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Mostrar skeletons de inmediato
            ['axl', 'frecuentes', 'varios'].forEach(cat => showSkeletons(cat));

            await loadAllLinks();
            setupEventListeners();
            switchView('axl');
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            elements.nav.home.addEventListener('click', () => { resetForm(); switchView('home'); });
            elements.nav.logo.addEventListener('click', () => window.history.back());
            elements.nav.logo.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.history.back(); }
            });

            elements.nav.hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                elements.nav.hamburger.classList.toggle('active');
                elements.nav.menu.classList.toggle('active');
            });

            document.addEventListener('click', (e) => {
                if (!elements.nav.hamburger.contains(e.target) && !elements.nav.menu.contains(e.target)) {
                    elements.nav.hamburger.classList.remove('active');
                    elements.nav.menu.classList.remove('active');
                }
            });

            elements.nav.menu.addEventListener('click', (e) => {
                const menuItem = e.target.closest('.menu-item');
                if (menuItem) {
                    const view = menuItem.getAttribute('data-view');
                    switchView(view);
                    elements.nav.hamburger.classList.remove('active');
                    elements.nav.menu.classList.remove('active');
                }
            });

            document.addEventListener('click', (e) => {
                const addBtn = e.target.closest('.btn-add');
                if (addBtn) {
                    const category = addBtn.getAttribute('data-category');
                    openFormForCategory(category);
                }
            });

            // Botones de reorden
            document.addEventListener('click', (e) => {
                const reorderBtn = e.target.closest('.btn-reorder');
                if (reorderBtn) {
                    const category = reorderBtn.getAttribute('data-category');
                    toggleReorderMode(category);
                }
            });

            // Botones de guardar orden
            document.addEventListener('click', (e) => {
                const saveBtn = e.target.closest('.btn-save-order');
                if (saveBtn) {
                    const category = saveBtn.getAttribute('data-category');
                    saveOrder(category);
                }
            });

            elements.form.cancel.addEventListener('click', () => { resetForm(); switchView(currentView); });

            elements.image.upload.addEventListener('click', (e) => {
                if (e.target !== elements.image.removeBtn && !elements.image.removeBtn.contains(e.target)) {
                    elements.image.input.click();
                }
            });

            elements.image.input.addEventListener('change', handleImageChange);
            elements.image.removeBtn.addEventListener('click', removeImage);
            elements.form.element.addEventListener('submit', handleSubmit);
        }

        // ============================================
        // NAVEGACIÓN
        // ============================================
        function switchView(view) {
            currentView = view;
            Object.values(elements.views).forEach(v => v.classList.remove('active'));
            elements.nav.home.classList.remove('active');
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

            if (view === 'home') {
                elements.views.home.classList.add('active');
                elements.nav.home.classList.add('active');
            } else {
                elements.views[view].classList.add('active');
                const menuItem = document.querySelector(`[data-view="${view}"]`);
                if (menuItem) menuItem.classList.add('active');
            }
        }

        function openFormForCategory(category) {
            resetForm();
            elements.form.category.value = category;
            switchView('home');
        }

        // ============================================
        // IMAGEN
        // ============================================
        function handleImageChange(e) {
            const file = e.target.files[0];
            if (!file) return;
            currentImageFile = file;
            const reader = new FileReader();
            reader.onloadend = () => {
                elements.image.preview.src = reader.result;
                elements.image.preview.style.display = 'block';
                elements.image.placeholder.style.display = 'none';
                elements.image.removeBtn.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removeImage(e) {
            e.stopPropagation();
            currentImageFile = null;
            currentImageUrl = null;
            elements.image.preview.style.display = 'none';
            elements.image.placeholder.style.display = 'flex';
            elements.image.removeBtn.style.display = 'none';
            elements.image.input.value = '';
        }

        // ============================================
        // CARGA DE DATOS
        // ============================================
        async function loadAllLinks() {
            await Promise.all([
                loadLinks('axl'),
                loadLinks('frecuentes'),
                loadLinks('varios')
            ]);
        }

        async function loadLinks(category) {
            try {
                const tableName = `links_${category}`;
                const { data, error } = await supabaseClient
                    .from(tableName)
                    .select('*')
                    .order('sort_order', { ascending: true })
                    .order('created_at', { ascending: false });

                if (error) throw error;

                linksData[category] = data || [];
                hideSkeletons(category);
                renderLinks(category);
            } catch (error) {
                console.error(`Error cargando links de ${category}:`, error);
                hideSkeletons(category);
                elements.containers[category].innerHTML = '<div class="empty-state"><p>Error al cargar los links</p></div>';
            }
        }

        // ============================================
        // RENDERIZADO
        // ============================================
        function renderLinks(category) {
            const container = elements.containers[category];
            const links = linksData[category];

            if (links.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>Tu galería está vacía.</p></div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'links-grid';
            grid.id = `grid-${category}`;

            // Aplicar modo reorder si estaba activo
            if (reorderState[category]) grid.classList.add('reorder-mode');

            links.forEach(link => {
                const card = createLinkCard(link, category);
                grid.appendChild(card);
                // Observar imagen para lazy load
                const img = card.querySelector('.card-img');
                if (img) imageObserver.observe(img);
            });

            container.innerHTML = '';
            container.appendChild(grid);

            // Configurar drag & drop
            setupDragAndDrop(grid, category);
        }

        function createLinkCard(link, category) {
            const card = document.createElement('div');
            card.className = 'link-card';
            card.setAttribute('data-id', link.id);
            card.setAttribute('draggable', 'true');

            card.innerHTML = `
                <div class="drag-handle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="9" cy="5" r="1" fill="currentColor"/>
                        <circle cx="15" cy="5" r="1" fill="currentColor"/>
                        <circle cx="9" cy="12" r="1" fill="currentColor"/>
                        <circle cx="15" cy="12" r="1" fill="currentColor"/>
                        <circle cx="9" cy="19" r="1" fill="currentColor"/>
                        <circle cx="15" cy="19" r="1" fill="currentColor"/>
                    </svg>
                </div>
                <div class="link-image">
                    <div class="img-skeleton"></div>
                    <img
                        class="card-img"
                        data-src="${link.image_url}"
                        src=""
                        alt="${link.title || 'Link'}"
                        loading="lazy"
                    >
                </div>
                <div class="link-content">
                    ${link.title ? `<h3 class="link-title">${link.title}</h3>` : ''}
                    <div class="link-actions ${!link.title ? 'no-title' : ''}">
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="action-btn action-link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                <polyline points="15 3 21 3 21 9"/>
                                <line x1="10" y1="14" x2="21" y2="3"/>
                            </svg>
                            Link
                        </a>
                        <button class="action-btn action-edit" data-action="edit" data-id="${link.id}" data-category="${category}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            Editar
                        </button>
                        <button class="action-btn action-delete" data-action="delete" data-id="${link.id}" data-category="${category}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Borrar
                        </button>
                    </div>
                </div>
            `;

            card.addEventListener('click', (e) => {
                if (reorderState[category]) return; // En modo reorder, ignorar clicks
                const actionBtn = e.target.closest('[data-action]');
                if (actionBtn) {
                    const action = actionBtn.getAttribute('data-action');
                    const id = actionBtn.getAttribute('data-id');
                    const cat = actionBtn.getAttribute('data-category');
                    if (action === 'edit') editLink(id, cat);
                    if (action === 'delete') deleteLink(id, cat);
                }
            });

            return card;
        }

        // ============================================
        // DRAG & DROP - Mouse + Touch
        // ============================================
        function setupDragAndDrop(grid, category) {
            let dragSrcCard = null;

            // ---- DESKTOP: HTML5 Drag & Drop ----
            grid.addEventListener('dragstart', (e) => {
                if (!reorderState[category]) return;
                dragSrcCard = e.target.closest('.link-card');
                if (!dragSrcCard) return;
                setTimeout(() => dragSrcCard.classList.add('dragging'), 0);
                e.dataTransfer.effectAllowed = 'move';
            });

            grid.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!reorderState[category]) return;
                const target = e.target.closest('.link-card');
                if (!target || target === dragSrcCard) return;

                grid.querySelectorAll('.link-card').forEach(c => c.classList.remove('drag-over'));
                target.classList.add('drag-over');

                // Reordenar visualmente en tiempo real
                const cards = [...grid.querySelectorAll('.link-card')];
                const srcIdx = cards.indexOf(dragSrcCard);
                const tgtIdx = cards.indexOf(target);

                if (srcIdx < tgtIdx) {
                    grid.insertBefore(dragSrcCard, target.nextSibling);
                } else {
                    grid.insertBefore(dragSrcCard, target);
                }
            });

            grid.addEventListener('dragleave', (e) => {
                const target = e.target.closest('.link-card');
                if (target) target.classList.remove('drag-over');
            });

            grid.addEventListener('dragend', () => {
                if (!reorderState[category]) return;
                grid.querySelectorAll('.link-card').forEach(c => {
                    c.classList.remove('dragging');
                    c.classList.remove('drag-over');
                });
                dragSrcCard = null;
            });

            // ---- MOBILE: Touch Events ----
            let touchCard = null;
            let touchClone = null;
            let touchOffsetX = 0;
            let touchOffsetY = 0;
            let lastTouchTarget = null;

            grid.addEventListener('touchstart', (e) => {
                if (!reorderState[category]) return;
                touchCard = e.target.closest('.link-card');
                if (!touchCard) return;

                const touch = e.touches[0];
                const rect = touchCard.getBoundingClientRect();
                touchOffsetX = touch.clientX - rect.left;
                touchOffsetY = touch.clientY - rect.top;

                // Clonar la card para efecto visual
                touchClone = touchCard.cloneNode(true);
                touchClone.style.cssText = `
                    position: fixed;
                    width: ${rect.width}px;
                    height: ${rect.height}px;
                    top: ${rect.top}px;
                    left: ${rect.left}px;
                    opacity: 0.85;
                    pointer-events: none;
                    z-index: 9999;
                    border-radius: 1rem;
                    border: 2px solid #ea580c;
                    box-shadow: 0 25px 50px rgba(234,88,12,0.3);
                    transition: none;
                    transform: scale(1.02);
                `;
                document.body.appendChild(touchClone);
                touchCard.classList.add('dragging');
                e.preventDefault();
            }, { passive: false });

            grid.addEventListener('touchmove', (e) => {
                if (!reorderState[category] || !touchCard || !touchClone) return;
                e.preventDefault();

                const touch = e.touches[0];
                touchClone.style.left = `${touch.clientX - touchOffsetX}px`;
                touchClone.style.top = `${touch.clientY - touchOffsetY}px`;

                // Encontrar card bajo el dedo
                touchClone.style.display = 'none';
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                touchClone.style.display = '';

                const targetCard = el ? el.closest('.link-card') : null;

                if (lastTouchTarget && lastTouchTarget !== touchCard) {
                    lastTouchTarget.classList.remove('drag-over');
                }

                if (targetCard && targetCard !== touchCard) {
                    targetCard.classList.add('drag-over');
                    lastTouchTarget = targetCard;

                    const cards = [...grid.querySelectorAll('.link-card')];
                    const srcIdx = cards.indexOf(touchCard);
                    const tgtIdx = cards.indexOf(targetCard);

                    if (srcIdx < tgtIdx) {
                        grid.insertBefore(touchCard, targetCard.nextSibling);
                    } else {
                        grid.insertBefore(touchCard, targetCard);
                    }
                }
            }, { passive: false });

            grid.addEventListener('touchend', () => {
                if (!reorderState[category]) return;
                if (touchClone) { touchClone.remove(); touchClone = null; }
                if (touchCard) { touchCard.classList.remove('dragging'); touchCard = null; }
                if (lastTouchTarget) { lastTouchTarget.classList.remove('drag-over'); lastTouchTarget = null; }
            });
        }

        // ============================================
        // MODO REORDEN
        // ============================================
        function toggleReorderMode(category) {
            reorderState[category] = !reorderState[category];

            const btn = document.getElementById(`reorderBtn-${category}`);
            const banner = document.getElementById(`reorderBanner-${category}`);
            const grid = document.getElementById(`grid-${category}`);

            btn.classList.toggle('active', reorderState[category]);
            banner.classList.toggle('active', reorderState[category]);

            if (grid) {
                grid.classList.toggle('reorder-mode', reorderState[category]);
            }
        }

        // ============================================
        // GUARDAR ORDEN EN SUPABASE
        // ============================================
        async function saveOrder(category) {
            const grid = document.getElementById(`grid-${category}`);
            if (!grid) return;

            const saveBtn = document.getElementById(`saveOrderBtn-${category}`);
            saveBtn.disabled = true;
            saveBtn.textContent = 'Guardando...';

            const cards = [...grid.querySelectorAll('.link-card')];
            const tableName = `links_${category}`;

            try {
                // Actualizar sort_order de cada card según su posición actual
                const updates = cards.map((card, index) => ({
                    id: card.getAttribute('data-id'),
                    sort_order: index
                }));

                // Actualizar cada registro (upsert en batch)
                const promises = updates.map(({ id, sort_order }) =>
                    supabaseClient
                        .from(tableName)
                        .update({ sort_order })
                        .eq('id', id)
                );

                await Promise.all(promises);

                // Actualizar el array local con el nuevo orden
                const newOrder = cards.map(card => {
                    return linksData[category].find(l => l.id === card.getAttribute('data-id'));
                }).filter(Boolean);
                linksData[category] = newOrder;

                showToast('✓ Orden guardado');
                toggleReorderMode(category);
            } catch (error) {
                console.error('Error guardando orden:', error);
                showToast('✗ Error al guardar el orden');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Guardar orden';
            }
        }

        // ============================================
        // SUBIR IMAGEN
        // ============================================
        async function uploadImage(file) {
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage
                .from('link-images')
                .upload(fileName, file);

            if (error) throw error;

            const { data: { publicUrl } } = supabaseClient.storage
                .from('link-images')
                .getPublicUrl(fileName);

            return publicUrl;
        }

        // ============================================
        // CRUD: CREAR / ACTUALIZAR
        // ============================================
        async function handleSubmit(e) {
            e.preventDefault();

            if (!currentImageFile && !isEditing) {
                alert('Por favor selecciona una imagen');
                return;
            }

            if (isEditing && !currentImageFile && !currentImageUrl) {
                alert('Por favor selecciona una imagen');
                return;
            }

            if (!elements.form.url.value) {
                alert('Por favor ingresa una URL');
                return;
            }

            const category = elements.form.category.value;

            try {
                let imageUrl = currentImageUrl;
                if (currentImageFile) imageUrl = await uploadImage(currentImageFile);

                let finalUrl = elements.form.url.value.trim();
                if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;

                const linkData = {
                    title: elements.form.titleInput.value.trim() || null,
                    url: finalUrl,
                    image_url: imageUrl
                };

                const tableName = `links_${category}`;

                if (isEditing && editingId) {
                    const { error } = await supabaseClient.from(tableName).update(linkData).eq('id', editingId);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from(tableName).insert([linkData]);
                    if (error) throw error;
                }

                resetForm();
                await loadLinks(category);
                switchView(category);
            } catch (error) {
                console.error('Error guardando link:', error);
                alert('Error al guardar el link: ' + error.message);
            }
        }

        // ============================================
        // CRUD: EDITAR
        // ============================================
        async function editLink(id, category) {
            const link = linksData[category].find(l => l.id === id);
            if (!link) return;

            isEditing = true;
            editingId = id;
            editingCategory = category;
            currentImageUrl = link.image_url;

            elements.form.category.value = category;
            elements.form.titleInput.value = link.title || '';
            elements.form.url.value = link.url;
            elements.image.preview.src = link.image_url;
            elements.image.preview.style.display = 'block';
            elements.image.placeholder.style.display = 'none';
            elements.image.removeBtn.style.display = 'flex';

            elements.form.title.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Modificar Link
            `;
            elements.form.submitText.textContent = 'Actualizar';
            switchView('home');
        }

        // ============================================
        // CRUD: ELIMINAR
        // ============================================
        async function deleteLink(id, category) {
            if (!confirm('¿Estás seguro de eliminar este link?')) return;

            try {
                const tableName = `links_${category}`;
                const { error } = await supabaseClient.from(tableName).delete().eq('id', id);
                if (error) throw error;
                await loadLinks(category);
            } catch (error) {
                console.error('Error eliminando link:', error);
                alert('Error al eliminar el link: ' + error.message);
            }
        }

        // ============================================
        // RESET FORMULARIO
        // ============================================
        function resetForm() {
            isEditing = false;
            editingId = null;
            editingCategory = null;
            currentImageFile = null;
            currentImageUrl = null;

            elements.form.titleInput.value = '';
            elements.form.url.value = '';
            elements.image.preview.style.display = 'none';
            elements.image.placeholder.style.display = 'flex';
            elements.image.removeBtn.style.display = 'none';
            elements.image.input.value = '';
            elements.form.category.value = 'axl';

            elements.form.title.innerHTML = `
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Nuevo Link
            `;
            elements.form.submitText.textContent = 'Guardar';
        }

        // ============================================
        // ARRANCAR
        // ============================================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
